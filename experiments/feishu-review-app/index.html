<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EvalDesk 审阅台</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <section class="import-screen" id="importScreen">
    <div class="import-shell">
      <div class="brand-block">
        <span class="brand-mark">E</span>
        <div>
          <strong>EvalDesk 审阅台</strong>
          <span>飞书内嵌评测应用</span>
        </div>
      </div>
      <div class="import-copy">
        <span class="eyebrow">任务包</span>
        <h1>载入本次审阅任务</h1>
        <p>选择管理员提供的 JSON 文件。任务与评分只保存在当前浏览器，完成后导出结果文件。</p>
      </div>
      <label class="file-drop" id="fileDrop" for="bundleInput">
        <input id="bundleInput" type="file" accept="application/json,.json">
        <span class="file-icon" aria-hidden="true">+</span>
        <strong>选择任务包</strong>
        <small>或将 JSON 拖到此处</small>
      </label>
      <button class="secondary demo-button" id="loadDemo" type="button">打开演示任务</button>
      <p class="import-error" id="importError" role="alert"></p>
    </div>
  </section>

  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="brand-block compact">
        <span class="brand-mark">E</span>
        <div>
          <strong>EvalDesk</strong>
          <span id="sheetName">审阅任务</span>
        </div>
      </div>
      <div class="progress">
        <span id="progressText">0 / 0</span>
        <div class="track"><i id="progressBar"></i></div>
      </div>
      <div class="top-actions">
        <label class="reviewer-field" for="reviewerName">
          <span>评测人</span>
          <input id="reviewerName" type="text" maxlength="40" placeholder="请填写">
        </label>
        <span class="save-state" id="saveState">本地已保存</span>
        <button class="secondary" id="changeBundle" type="button">更换任务包</button>
        <button class="primary" id="exportResults" type="button">导出结果</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="queue">
        <div class="queue-head">
          <strong>任务队列</strong>
          <div class="filters" role="group" aria-label="筛选任务">
            <button class="active" type="button" data-filter="all">全部</button>
            <button type="button" data-filter="pending">待审</button>
            <button type="button" data-filter="done">完成</button>
          </div>
        </div>
        <div class="task-list" id="taskList"></div>
      </aside>

      <section class="review">
        <div class="review-head">
          <div>
            <span class="eyebrow" id="taskKind">评测任务</span>
            <h1 id="taskTitle">任务</h1>
          </div>
          <div class="task-nav">
            <button class="icon-button" id="previous" type="button" title="上一条" aria-label="上一条">‹</button>
            <button class="icon-button" id="next" type="button" title="下一条" aria-label="下一条">›</button>
          </div>
        </div>

        <section class="media-section" id="referenceSection">
          <div class="section-heading">
            <span>01</span>
            <div><h2>参考素材</h2><small>全部同时展示</small></div>
          </div>
          <div class="reference-grid" id="references"></div>
        </section>

        <section class="media-section">
          <div class="section-heading output-heading">
            <span>02</span>
            <div><h2>生成结果</h2><small>输出顺序与评分列一致</small></div>
          </div>
          <div class="output-grid" id="outputs"></div>
        </section>

        <section class="prompt-section">
          <div class="section-heading">
            <span>03</span>
            <div><h2>任务提示词</h2><small>原始 Prompt</small></div>
          </div>
          <div class="prompt" id="prompt"></div>
        </section>
      </section>

      <aside class="scoring">
        <div class="scoring-head">
          <div>
            <span class="eyebrow">评分矩阵</span>
            <h2>各输出并排评分</h2>
          </div>
          <button class="primary save-next" id="saveNext" type="button">登记并下一条</button>
        </div>
        <div class="matrix-wrap">
          <table class="score-matrix">
            <thead id="scoreHead"></thead>
            <tbody id="scoreBody"></tbody>
          </table>
        </div>
        <div class="detail-list" id="detailList"></div>
      </aside>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
